[project]
name = "ripple-mcp"
version = "0.1.0"
description = "RippleMCP — change impact analysis for Python/FastAPI/PostgreSQL codebases, exposed as a remote MCP server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.1.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "sqlglot>=24.0.0",
    "neo4j>=5.20.0",
    "gitpython>=3.1.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ripple"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
